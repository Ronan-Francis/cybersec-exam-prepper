<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSSP Exam Prep</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/infinite.css">
  <link rel="stylesheet" href="css/study.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-mode="quiz">

<header class="topbar">
  <div class="topbar-inner">
    <h1>CSSP Exam Prep</h1>
    <nav class="modetabs" aria-label="Mode">
      <button type="button" data-mode="quiz" aria-pressed="true">Quiz</button>
      <button type="button" data-mode="infinite" aria-pressed="false">Infinite</button>
      <button type="button" data-mode="study" aria-pressed="false">Study</button>
    </nav>
  </div>
</header>

<div class="workspace">
  <aside class="side" aria-label="Side blocks">

    <!-- Infinite mode fills this block (js/modes/infinite/infinite-side-panel.js). -->
    <section class="block inf-block" id="infiniteSide" hidden aria-label="Infinite session"></section>

    <!-- Quiz mode: navigation (js/modes/quiz/quiz-nav.js) and setup form (js/modes/quiz/quiz-setup.js). -->
    <div class="side-group" id="quizSide" hidden>
      <section class="block" aria-labelledby="navh">
        <h2 id="navh">Quiz navigation</h2>
        <div class="navgrid" id="navgrid"></div>
        <button type="button" class="linkbtn" id="finishBtn">Finish attempt…</button>
        <p class="navtime">Time taken <span id="timer">00:00</span></p>
      </section>

      <details class="block setup" id="setup" open>
        <summary>New quiz</summary>
        <form id="setupForm" novalidate>
          <fieldset>
            <legend>Mode</legend>
            <label class="pick"><input type="radio" name="style" value="practice" checked><span>Practice: check each answer as you go</span></label>
            <label class="pick"><input type="radio" name="style" value="exam"><span>Exam: marked at the end</span></label>
          </fieldset>
          <fieldset>
            <legend>Chapters <button type="button" class="linkbtn" data-all="ch">All</button><button type="button" class="linkbtn" data-none="ch">None</button></legend>
            <div id="chapterList"></div>
          </fieldset>
          <fieldset>
            <legend>Question types <button type="button" class="linkbtn" data-all="ty">All</button><button type="button" class="linkbtn" data-none="ty">None</button></legend>
            <div id="typeList"></div>
          </fieldset>
          <div class="field">
            <label for="count">Number of questions</label>
            <select id="count">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="all">All that match</option>
            </select>
          </div>
          <label class="pick"><input type="checkbox" id="missed"><span>Only questions I've got wrong <span class="muted" id="missedCount"></span></span></label>
          <p class="poolinfo" id="poolInfo" aria-live="polite"></p>
          <div><button type="submit" class="btn primary">Start quiz</button></div>
        </form>
        <div class="presets">
          <button type="button" class="linkbtn" data-preset="mock">Mock exam: 30 questions, marked at the end</button>
          <button type="button" class="linkbtn" data-preset="quick">Quick practice: 10 questions</button>
        </div>
      </details>
    </div>
  </aside>

  <!-- The active mode draws its page here. -->
  <main class="stage" id="stage">
    <p class="muted">Loading questions… If this doesn't go away, the page was probably opened straight from a file. Run <code>npm start</code> and use the address it prints.</p>
  </main>
</div>

</body>
</html>
